# 芦屋みっけ Web制作：API と公開ページの配信（1つの Worker）
# 一番上の設定は local（wrangler dev）用。本番・試しは下の [env.*] を埋める（README「本番に出すとき」）。
name = "mikke-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 公開ページのドメイン。<お店のスラッグ>.<PUBLIC_DOMAIN> でお店を引く
PUBLIC_DOMAIN = "localhost"
# local だけ：公開ページのアドレスの番号（http://ashiyado.localhost:8787/）
PUBLIC_PORT = "8787"
# 編集画面のオリジン（CSRF の確かめ・CORS・ログインのリンクの行き先）。カンマ区切りで複数可。先頭がリンクの行き先
APP_ORIGINS = "http://localhost:8787"
# メールの送り先：log（ログに出すだけ）／memory（試験用）／resend（本番。RESEND_API_KEY は秘密の値、MAIL_FROM は送り元）
MAILER = "log"
# local の http でも Cookie が付くように。本番は "true"
COOKIE_SECURE = "false"
# AUTH_SECRET は .dev.vars（local）か `wrangler secret put AUTH_SECRET`（本番）で渡す

[[d1_databases]]
binding = "DB"
database_name = "mikke"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mikke-media"

# ログインの手前の IP ごとの回数の制限（Workers の Rate Limiting）は、local には置かない（なければ数えない）。
# 本番・試しでは下の [[env.*.ratelimits]] を必ず書く（上の段からは引き継がれない）

# 毎日 0 時（日本時間）＝ UTC 15:00
[triggers]
crons = ["0 15 * * *"]

