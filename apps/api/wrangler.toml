# 芦屋みっけ Web制作：API と公開ページの配信（1つの Worker）
# 一番上の設定は local（wrangler dev）用。本番・試しは下の [env.*] を埋める（README「本番に出すとき」）。
name = "mikke-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 公開ページのドメイン。<お店のスラッグ>.<PUBLIC_DOMAIN> でお店を引く
PUBLIC_DOMAIN = "localhost"
# local だけ：公開ページのアドレスの番号（http://ashiyado.localhost:8787/）
PUBLIC_PORT = "8787"
# 編集画面のオリジン（CSRF の確かめ・CORS・ログインのリンクの行き先）。カンマ区切りで複数可。先頭がリンクの行き先
APP_ORIGINS = "http://localhost:8787"
# メールの送り先：log（ログに出すだけ）／memory（試験用）／resend（本番。RESEND_API_KEY は秘密の値、MAIL_FROM は送り元）
MAILER = "log"
# local の http でも Cookie が付くように。本番は "true"
COOKIE_SECURE = "false"
# AUTH_SECRET は .dev.vars（local）か `wrangler secret put AUTH_SECRET`（本番）で渡す

[[d1_databases]]
binding = "DB"
database_name = "mikke"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mikke-media"

# ログインの手前の IP ごとの回数の制限（Workers の Rate Limiting）は、local には置かない（なければ数えない）。
# 本番・試しでは下の [[env.*.ratelimits]] を必ず書く（上の段からは引き継がれない）

# 毎日 0 時（日本時間）＝ UTC 15:00
[triggers]
crons = ["0 15 * * *"]

# ======================================================================
# 秘密の値（名前だけ。値はここにも git にも書かない）
#   AUTH_SECRET     … 必須。32 文字以上（`openssl rand -hex 32`）。
#                     local：.dev.vars（.dev.vars.example を写す）
#                     dev・prod：`npx wrangler secret put AUTH_SECRET --env dev`（prod は --env prod）
#   RESEND_API_KEY  … MAILER = "resend" のとき必須（dev・prod）。`npx wrangler secret put RESEND_API_KEY --env prod`
#   EDIT_RUNNER_SECRET … 任意。段2 の PC の runner が ① を読み書きする鍵（32 文字以上）。無ければ /edit-api は閉じる
# 秘密ではない設定（vars。環境ごとに下で書く。上の段からは引き継がれない）
#   PUBLIC_DOMAIN・APP_ORIGINS・MAILER・MAIL_FROM・COOKIE_SECURE・LINE_LOGIN_CHANNEL_ID・PUBLIC_PORT（local だけ）
# 結びつけ（環境ごとに下で書く。上の段からは引き継がれない）
#   DB（D1）・BUCKET（R2）・LOGIN_IP_LIMITER（Rate Limiting）
# ======================================================================

# ---- dev（試しの環境。Cloudflare に出すとき `--env dev`）----
# 作り方（ユーザーが手元で）：
#   npx wrangler d1 create mikke-shops-db-dev     → 出た database_id を下に
#   npx wrangler r2 bucket create mikke-shops-photos-dev
[env.dev]
name = "mikke-api-dev"
# routes は公開のドメイン・アプリのドメインが決まってから（README「本番に出すとき」。2 段のワイルドカードは無料の証明書では足りない）
# routes = [{ pattern = "*-dev.<公開のドメイン>/*", zone_name = "<公開のドメイン>" }, { pattern = "app-dev.<アプリのドメイン>/*", zone_name = "<アプリのドメイン>" }]
triggers = { crons = ["0 15 * * *"] }

[env.dev.vars]
# ↓ 仮の値（example のドメイン。まだ届かない）。ドメインが決まったら差し替える
PUBLIC_DOMAIN = "dev.public.example"
APP_ORIGINS = "https://app-dev.app.example"
MAILER = "resend"
MAIL_FROM = "芦屋みっけ <login@mail.app.example>"
COOKIE_SECURE = "true"
PUBLIC_PORT = ""                      # local だけ使う。空にしておく（上の段から引き継がれない警告を消すため）
LINE_LOGIN_CHANNEL_ID = ""            # LINE ログイン（LIFF）のチャネル ID。空のあいだは LINE では入れない（メールだけ）

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mikke-shops-db-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"   # ← 仮。`wrangler d1 create` で出た ID に差し替える
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "mikke-shops-photos-dev"

[[env.dev.ratelimits]]
name = "LOGIN_IP_LIMITER"
namespace_id = "1001"                 # アカウントの中で環境ごとに別の数字
simple = { limit = 10, period = 60 }  # 同じ IP から、申し込み・確かめそれぞれ 1 分に 10 回まで

# ---- prod（本番。`--env prod`）----
#   npx wrangler d1 create mikke-shops-db       → 出た database_id を下に
#   npx wrangler r2 bucket create mikke-shops-photos
[env.prod]
name = "mikke-api-prod"
# routes = [{ pattern = "*.<公開のドメイン>/*", zone_name = "<公開のドメイン>" }, { pattern = "app.<アプリのドメイン>/*", zone_name = "<アプリのドメイン>" }]
triggers = { crons = ["0 15 * * *"] }

[env.prod.vars]
# ↓ 仮の値。ドメインが決まったら差し替える
PUBLIC_DOMAIN = "public.example"
APP_ORIGINS = "https://app.app.example"
MAILER = "resend"
MAIL_FROM = "芦屋みっけ <login@mail.app.example>"
COOKIE_SECURE = "true"
PUBLIC_PORT = ""
LINE_LOGIN_CHANNEL_ID = ""            # LINE ログイン（LIFF）のチャネル ID。空のあいだは LINE では入れない（メールだけ）

[[env.prod.d1_databases]]
binding = "DB"
database_name = "mikke-shops-db"
database_id = "REPLACE_WITH_PROD_D1_DATABASE_ID"  # ← 仮。`wrangler d1 create` で出た ID に差し替える
migrations_dir = "migrations"

[[env.prod.r2_buckets]]
binding = "BUCKET"
bucket_name = "mikke-shops-photos"

[[env.prod.ratelimits]]
name = "LOGIN_IP_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
