name: ci

# push と PR のたびに：単体試験 → 編集画面を組み立てる → 本物の操作の確認（8 area を同時に）→ ラチェット
# 走らせる所は ubuntu-24.04 に固定（ubuntu-latest は 2026-10-19 から Ubuntu 26 に移り、playwright 1.56 の --with-deps が通らない）
on:
  push:
    branches: [main, 'track/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EDITOR_HTML: apps/editor/dist/editor_single.html

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps   # 古い書き出しの試験（metacheck）が chromium・webkit・firefox を使う
      - run: npm test
      - name: API の試験（apps/api があれば）
        if: hashFiles('apps/api/package.json') != ''
        working-directory: apps/api
        run: |
          npm ci
          npm test

  e2e-api:
    # 編集画面 ⇄ API の通しの試験（ログイン・保存・写真・公開・ぶつかり）。wrangler dev をローカルで立てる
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: apps/api
      - run: npm run build:editor
      - run: npm run test:publish
      - run: node --test apps/editor/test/e2e-api.test.mjs

  build-editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:editor
      - run: npm run test:core
      - uses: actions/upload-artifact@v4
        with:
          name: editor
          path: apps/editor/dist/

  audit:
    needs: build-editor
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        area: [text, parts, page, ppt1, ppt2, misc1, misc2, misc3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: editor, path: apps/editor/dist }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.56.0 pillow
      - run: python -m playwright install --with-deps chromium
      - name: 確認（${{ matrix.area }}）
        run: |
          mkdir -p logs
          HTML="$GITHUB_WORKSPACE/$EDITOR_HTML"
          ( cd logs && AUDIT_JOBS=1 python "$GITHUB_WORKSPACE/tools/verify-audit/verify_audit_${{ matrix.area }}.py" "$HTML" > "${{ matrix.area }}.log" 2>&1 ) || true
          grep -E '^(NG|合計)' logs/${{ matrix.area }}.log | head -60
      - uses: actions/upload-artifact@v4
        with: { name: 'audit-${{ matrix.area }}', path: 'logs/${{ matrix.area }}.log' }

  ratchet:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'audit-*', path: logs, merge-multiple: true }
      - name: 今 NG でよい一覧と比べる（一覧の外の NG があれば失敗）
        run: python3 tools/verify-audit/ratchet.py logs tools/verify-audit/expected_ng.txt
